<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="72%">
      <stop offset="0%" stop-color="#1e2942"/>
      <stop offset="65%" stop-color="#111726"/>
      <stop offset="100%" stop-color="#090c14"/>
    </radialGradient>
    <linearGradient id="octoBody" x1="150" y1="120" x2="360" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff6b9d"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="octoHighlight" x1="200" y1="125" x2="260" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fecdd3" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#fb7185" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="bubbleCyan" cx="35%" cy="30%" r="68%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="35%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </radialGradient>
    <radialGradient id="bubbleViolet" cx="35%" cy="30%" r="68%">
      <stop offset="0%" stop-color="#ede9fe"/>
      <stop offset="35%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </radialGradient>
    <radialGradient id="bubbleEmerald" cx="35%" cy="30%" r="68%">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="35%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#059669"/>
    </radialGradient>
    <radialGradient id="bubbleAmber" cx="35%" cy="30%" r="68%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="35%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </radialGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded App Icon Backdrop -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Subtle 8x8 Grid Hint Behind Octopus -->
  <g opacity="0.12" stroke="#94a3b8" stroke-width="2">
    <rect x="64" y="64" width="384" height="384" rx="28" fill="none"/>
    <line x1="160" y1="64" x2="160" y2="448"/>
    <line x1="256" y1="64" x2="256" y2="448"/>
    <line x1="352" y1="64" x2="352" y2="448"/>
    <line x1="64" y1="160" x2="448" y2="160"/>
    <line x1="64" y1="256" x2="448" y2="256"/>
    <line x1="64" y1="352" x2="448" y2="352"/>
  </g>

  <!-- Glowing Popping Bubbles & Pop Sparkles -->
  <g filter="url(#softGlow)">
    <circle cx="104" cy="128" r="34" fill="url(#bubbleCyan)"/>
    <ellipse cx="93" cy="116" rx="11" ry="6" transform="rotate(-30 93 116)" fill="#ffffff" opacity="0.8"/>

    <circle cx="408" cy="118" r="28" fill="url(#bubbleViolet)"/>
    <ellipse cx="399" cy="109" rx="9" ry="5" transform="rotate(-30 399 109)" fill="#ffffff" opacity="0.8"/>

    <circle cx="422" cy="248" r="22" fill="url(#bubbleAmber)"/>
    <ellipse cx="415" cy="241" rx="7" ry="4" transform="rotate(-30 415 241)" fill="#ffffff" opacity="0.8"/>

    <circle cx="92" cy="264" r="24" fill="url(#bubbleEmerald)"/>
    <ellipse cx="84" cy="256" rx="7.5" ry="4" transform="rotate(-30 84 256)" fill="#ffffff" opacity="0.8"/>

    <circle cx="132" cy="404" r="18" fill="url(#bubbleAmber)"/>
    <circle cx="388" cy="398" r="26" fill="url(#bubbleCyan)"/>
    <ellipse cx="379" cy="389" rx="8" ry="4.5" transform="rotate(-30 379 389)" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- Pop Burst Rays (Top Right Bubble Pop) -->
  <g stroke="#67e8f9" stroke-width="5" stroke-linecap="round" opacity="0.9">
    <line x1="146" y1="84" x2="158" y2="70"/>
    <line x1="158" y1="106" x2="174" y2="100"/>
    <line x1="124" y1="74" x2="126" y2="56"/>
  </g>
  <g stroke="#fde68a" stroke-width="4.5" stroke-linecap="round" opacity="0.85">
    <line x1="364" y1="88" x2="352" y2="74"/>
    <line x1="356" y1="112" x2="340" y2="108"/>
  </g>

  <!-- Octopus Tentacles -->
  <path d="M168 308 C140 330, 128 362, 152 374 C172 384, 188 362, 188 338" fill="url(#octoBody)"/>
  <path d="M204 322 C192 360, 198 394, 222 396 C242 398, 248 368, 240 334" fill="url(#octoBody)"/>
  <path d="M272 334 C264 368, 270 398, 290 396 C314 394, 320 360, 308 322" fill="url(#octoBody)"/>
  <path d="M324 338 C324 362, 340 384, 360 374 C384 362, 372 330, 344 308" fill="url(#octoBody)"/>
  <path d="M150 282 C116 290, 102 318, 120 334 C136 348, 160 332, 168 306" fill="url(#octoBody)"/>
  <path d="M362 282 C396 290, 410 318, 392 334 C376 348, 352 332, 344 306" fill="url(#octoBody)"/>

  <!-- Octopus Mantle / Head -->
  <ellipse cx="256" cy="232" rx="108" ry="102" fill="url(#octoBody)"/>
  <ellipse cx="222" cy="176" rx="46" ry="30" transform="rotate(-24 222 176)" fill="url(#octoHighlight)"/>

  <!-- Cute Cheek Blushes -->
  <ellipse cx="186" cy="264" rx="18" ry="10" fill="#fda4af" opacity="0.55"/>
  <ellipse cx="326" cy="264" rx="18" ry="10" fill="#fda4af" opacity="0.55"/>

  <!-- Expressive Eyes -->
  <circle cx="212" cy="236" r="24" fill="#0f172a"/>
  <circle cx="300" cy="236" r="24" fill="#0f172a"/>
  <circle cx="204" cy="227" r="9" fill="#ffffff"/>
  <circle cx="292" cy="227" r="9" fill="#ffffff"/>
  <circle cx="221" cy="246" r="4" fill="#ffffff" opacity="0.85"/>
  <circle cx="309" cy="246" r="4" fill="#ffffff" opacity="0.85"/>

  <!-- Happy Smile -->
  <path d="M236 266 Q256 286 276 266" stroke="#0f172a" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- Tiny Suction Cups on Front Tentacles -->
  <g fill="#fecdd3" opacity="0.8">
    <circle cx="152" cy="356" r="5"/>
    <circle cx="218" cy="378" r="5"/>
    <circle cx="294" cy="378" r="5"/>
    <circle cx="360" cy="356" r="5"/>
  </g>
</svg>
